<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/></svg>');
            opacity: 0.3;
        }
        .error-container {
            text-align: center;
            color: white;
            z-index: 1;
            position: relative;
            padding: 40px;
        }
        .error-code {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        .error-message {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .error-description {
            font-size: 1.2rem;
            opacity: 0.95;
            margin-bottom: 40px;
        }
        .error-icon {
            font-size: 8rem;
            margin-bottom: 30px;
            animation: float 4s ease-in-out infinite;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            background: white;
            color: #0891b2;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: particle-float 4s ease-in-out infinite;
        }
        @keyframes particle-float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.6; }
            50% { transform: translateY(-40px) translateX(-10px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle" style="width: 6px; height: 6px; left: 10%; top: 20%; animation-delay: 0s;"></div>
        <div class="particle" style="width: 4px; height: 4px; left: 20%; top: 80%; animation-delay: 0.5s;"></div>
        <div class="particle" style="width: 8px; height: 8px; left: 30%; top: 40%; animation-delay: 1s;"></div>
        <div class="particle" style="width: 5px; height: 5px; left: 70%; top: 60%; animation-delay: 1.5s;"></div>
        <div class="particle" style="width: 6px; height: 6px; left: 80%; top: 20%; animation-delay: 2s;"></div>
        <div class="particle" style="width: 4px; height: 4px; left: 90%; top: 70%; animation-delay: 2.5s;"></div>
    </div>
    
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-route"></i>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-message">Oops! Wrong Turn</h1>
        <p class="error-description">The page you're looking for seems to have taken a different route.</p>
        <a href="/" class="home-btn">
            <i class="fas fa-home"></i>
            <span>Back to Home</span>
        </a>
    </div>
</body>
</html>
